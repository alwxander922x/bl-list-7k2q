const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.s),iterations:P.i,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.v)},key,b64(P.d));
  return new TextDecoder().decode(buf);
}
document.getElementById("f").addEventListener("submit",async ev=>{

  const btn=document.getElementById("b"),err=document.getElementById("e");

  try{

    btn.disabled=false;btn.textContent="Открыть";
    document.getElementById("p").select();

});
